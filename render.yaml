# Render Blueprint — PhacoStats V1
# https://render.com/docs/blueprint-spec
#
# Deploy: Dashboard → New → Blueprint → connect Cornea35/PhacoStatsV1

databases:
  - name: phacostats-db
    plan: free

services:
  - type: web
    name: phacostats-v1
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phacostats-db
          property: connectionString
