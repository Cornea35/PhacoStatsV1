<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PhacoStats{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css?v=dark1" rel="stylesheet">
  <style id="brandTheme">:root { {{ brand_css|default('') }} }</style>
  {% block head %}{% endblock %}
</head>
<body class="public-shell" {% if theme and theme.cover_url %}style="background-image:linear-gradient(rgba(11,18,32,.88),rgba(11,18,32,.92)),url('{{ theme.cover_url }}');background-size:cover;"{% endif %}>
  <main class="container pb-5">
    {% if flashes %}
      {% for item in flashes %}
      <div class="alert alert-{{ item.category }} alert-dismissible fade show mt-3" role="alert">
        {{ item.message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="border-top py-3 text-center text-muted small">
    PhacoStats © 2026 Dr. Erik Navas. Todos los derechos reservados.
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
