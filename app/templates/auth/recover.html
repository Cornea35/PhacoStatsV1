{% extends "base_public.html" %}
{% block title %}Recuperar contraseña · PhacoStats{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Recuperar contraseña</h1>
        <form method="post" action="/recover">
          <div class="mb-3">
            <label class="form-label" for="email">Correo o usuario</label>
            <input class="form-control" id="email" name="email" required>
          </div>
          <button class="btn btn-codet w-100" type="submit">Continuar</button>
        </form>
        <p class="small text-muted mt-3 mb-0"><a href="/login">Volver al inicio de sesión</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
