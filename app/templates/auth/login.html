{% extends "base.html" %}
{% block title %}Iniciar sesión · CODET Vision Institute{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4 mt-md-5">
  <div class="col-md-5">
    <div class="card shadow-sm login-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <img src="/static/img/codet-logo.png" alt="CODET Vision Institute" class="brand-logo brand-logo-login mb-3">
          <p class="brand-org-login mb-1">CODET Vision Institute</p>
          <h1 class="h3 mb-1">PhacoStats</h1>
          <p class="text-muted mb-0">Registro anónimo de facoemulsificación y complicaciones</p>
        </div>
        <form method="post" action="/login">
          <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control" id="username" name="username" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password" required>
          </div>
          <button class="btn btn-codet w-100" type="submit">Entrar</button>
        </form>
        <hr>
        <p class="small text-muted mb-0">
          Demo: <code>admin</code> / <code>admin123</code> ·
          <code>cirujano1</code> / <code>cirujano123</code> ·
          <code>coord</code> / <code>coord123</code>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
